name: First Workflow
on: push
jobs:
    test: 
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Install node
              uses: actions/setup-node@v7
              with:
                node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
            - name: Lint code
              run: npm run lint
            - name: Build project
              run: npm run build